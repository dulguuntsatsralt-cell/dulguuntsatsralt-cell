name: skyline

on:
  schedule:
    - cron: "17 4 * * *"   # once a day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw skyline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/skyline.py ${{ github.repository_owner }} exhibit-c-skyline.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exhibit-c-skyline.svg
          git diff --cached --quiet || (git commit -m "Update contribution skyline" && git push)
