<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="ttl dsc"><title id="ttl">MK33 training loop</title><desc id="dsc">Each agent turn is kept for training only if the score moved; when context fills, a round ledger replaces old turns (2.4-9.6x faster per call than truncation); H2O eviction at half context stays within 0.05-0.07 nats of the full KV cache. Apache-2.0, 17 ablations, 140+ tests.</desc>
<style>
  .bg{fill:#0b0b0b}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.02em}
  .h{fill:#f2f2f2;font-size:13px}
  .hd{fill:#8a8a8a;font-size:11px}
  .t{fill:#ffffff;font-size:11px;font-weight:700}
  .n{fill:#ffffff;font-size:11px;font-weight:700}
  .p{fill:#8a8a8a;font-size:9.5px}
  .a{fill:#ffffff;font-size:11px;font-weight:700}
  .ap{fill:#bdbdbd;font-size:9.5px}
  .ln{fill:none;stroke:#ececec;stroke-width:1.6;stroke-linecap:round}
  .thick{stroke-width:3.2}
  .am{stroke:#ffffff}
  .dt{fill:none;stroke:#6f6f6f;stroke-width:1.2;stroke-dasharray:1.5 3.5;stroke-linecap:round}
  .ref{fill:none;stroke:#2c2c2c;stroke-width:1;stroke-dasharray:2 4}
  .node{fill:#ececec}
  .hole{fill:#0b0b0b;stroke:#ececec;stroke-width:1.4}
  .kept{fill:#ececec}
  .drop{fill:#0b0b0b;stroke:#9a9a9a;stroke-width:1.2}
  .kepta{fill:#ffffff}
  .gap{fill:url(#hatch);opacity:1}
  .wall{stroke:#ececec;stroke-width:1.2}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.4,0,.2,1) forwards}
  .fade{opacity:0;animation:fade .45s ease-out forwards}
  .gap.fade{animation:fadeg .8s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes fadeg{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .draw{animation:none;stroke-dashoffset:0}
    .fade{animation:none;opacity:1}
    .gap.fade{opacity:1}
  }
</style>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5a5a5a" stroke-width="1.2"/></pattern></defs>
<rect class="bg" width="1000" height="520"/><text class="h fade" x="40" y="34" text-anchor="start" style="animation-delay:0.00s">EXHIBIT A: MK33</text>
<text class="hd fade" x="960" y="34" text-anchor="end" style="animation-delay:0.00s">SOLE AUTHOR, PREPRINT, 2026</text>
<text class="hd fade" x="40" y="54" text-anchor="start" style="animation-delay:0.00s">ONE LONG SELF-IMPROVEMENT RUN, EVERY STEP A CONFIG VALUE</text>
<text class="hd fade" x="960" y="54" text-anchor="end" style="animation-delay:0.00s">17 ABLATIONS</text>
