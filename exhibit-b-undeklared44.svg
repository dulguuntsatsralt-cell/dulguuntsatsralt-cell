<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="ttl dsc"><title id="ttl">undeklared44: Mongolia coal exports vs China customs</title><desc id="dsc">Tonnes in China's customs record match Mongolia's within about 2% a year since 2017. Dollars drop to 73% in 2021 and 78% in 2022, about $2B missing Jan 2021-Aug 2022. Indonesian and Canadian coal show no gap. Five pre-registered satellite tests all failed and are logged.</desc>
